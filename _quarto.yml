project:
  type: website

# Language profiles. `english` is the default; each profile is defined in
# _quarto-english.yml / _quarto-german.yml and renders to its own subfolder.
profile:
  default: english
  group:
    - [english, german]

website:
  title: "Matthew Hawke"

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    # Cookie-free page-view counting; dashboard at matthewhawke.goatcounter.com
    include-in-header:
      text: |
        <script data-goatcounter="https://matthewhawke.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    toc: true
